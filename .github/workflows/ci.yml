name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # Ubuntu 24.04 ships Qt 6.4 and mpv 0.37, the versions Reelplay is developed against.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config qt6-base-dev libgl-dev libgl1-mesa-dri libmpv-dev \
            xvfb openbox x11-utils dbus-x11 libglib2.0-bin ffmpeg

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Run tests under a virtual display with a window manager and session bus
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          REELPLAY_AO: "null"
        run: |
          # Some tests need focus and always-on-top state, which only a window manager provides.
          xvfb-run -a dbus-run-session -- bash -c '
            openbox --sm-disable >/dev/null 2>&1 &
            sleep 3
            ./build/test_player
          '

      - name: Build the Debian package
        run: cmake --build build --target package

      - uses: actions/upload-artifact@v4
        with:
          name: reelplay-deb
          path: build/*.deb
